[project]
name = "apex-horizon"
version = "0.0.1"
description = "Apex Horizon — official single-player business and investment simulation game."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Trjo Development Studio" }]
requires-python = ">=3.11"
# Apex Horizon is built with Python and Pygame. `pygame-ce` provides the
# standard `pygame` import with maintained wheels. Design Bible V15.9 and V19.15
# require dependencies to stay minimal and be approved before being added.
dependencies = [
    "pygame-ce>=2.5.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Put the repo root on sys.path so `pytest` (not just `python -m pytest`)
# can import the game package, in CI and locally.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
# Pinned explicitly so a future Ruff release cannot change the enabled rule set
# underneath CI (Design Bible V19.11: warnings should not accumulate).
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (imports, statements, syntax)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplifications
    "RUF",             # ruff-specific rules
]
