# Apex Horizon — gameplay configuration.
#
# Design Bible V15.10 requires that gameplay values live in dedicated
# configuration files rather than being scattered through source code, so that
# balance changes never require touching simulation logic (see also V1.22).
#
# Every value below cites the Design Bible section it comes from. Values marked
# "PM decision" were supplied by the project manager where the Design Bible
# deliberately left the figure undefined.

[player]
# V1.2 / V2.3 — the player begins with $10,000 personal capital.
starting_personal_cash = 10_000
# V1.13 — the playthrough ends when personal finances reach this balance.
personal_bankruptcy_threshold = -250_000

[company]
# PM decision (2026-08-08) — founding a company costs $25,000 of personal cash.
# The same figure gates re-founding after a bankruptcy (V3.3 left this open).
founding_cost = 25_000
# PM decision (2026-08-08) — company bankruptcy occurs at this company cash
# balance. V3.20 / V17.25 explicitly left this threshold undefined.
bankruptcy_cash_threshold = -1_000_000
# V3.7 — companies progress through Levels 1-5.
max_level = 5

[simulation]
# V13.4 — default simulation speed is one real-life second per in-game day.
seconds_per_day = 1.0
# V13.5 / V14.18 — the player may run the simulation at these speeds.
speed_options = [1, 2, 3]
default_speed = 1
# V13.19 — a general background update occurs roughly every five ticks.
background_update_every_ticks = 5
# Upper bound on in-game days simulated in a single update call. V13.27 requires
# long unattended sessions to remain stable and deterministic, so surplus days
# are carried forward and caught up over following frames rather than dropped —
# this cap only keeps any one frame from blocking the interface (V13.29).
max_days_per_update = 30
# Fixed seed used when a world does not supply one. Real saves store their own
# seed so a reloaded world replays identically (V15.11).
default_random_seed = 20260808

[calendar]
# V13.6 — the calendar hierarchy is Year -> Month -> Week -> Day, displayed as
# e.g. "Year 3, Month 8, Week 2, Day 4". V30.4 requires time to be stored as a
# single continuously incrementing day counter, from which this calendar is
# derived (never the reverse).
#
# Seven-day weeks are established by the training example in V5.9/V13.12
# ("beginning on a Friday for 10 days completes the following Monday").
# The Design Bible does not state weeks per month or months per year; uniform
# 4-week months are used so weeks nest cleanly inside months as the V13.6
# display format implies. TODO: confirm with the project manager.
days_per_week = 7
weeks_per_month = 4
months_per_year = 12

[world]
# Initial size of a generated world (V34). These are starting populations, not
# pool limits: the naming databases can produce far more unique names than any
# single playthrough consumes, so the market can keep generating new companies
# across a full lifecycle (V4.14, V33.3).
companies = 60
banks = 8
cities = 24
news_agencies = 5
universities = 6
organisations = 5

[random_events]
# V13.18 — approximate probability that a random event fires at each scale.
daily_chance = 0.05
weekly_chance = 0.25
monthly_chance = 0.35
yearly_chance = 0.35

[save]
# V16.8 — five manual save slots, each an independent world.
manual_slots = 5
# V16.5 / V13.10 — autosave every in-game month by default; player-adjustable.
autosave_interval_months = 1
# V16.7 — a single rolling autosave; each new autosave replaces the previous.
rolling_autosave_slots = 1

[support]
# V15.13 — players are asked to report unrecoverable errors here.
# TODO: replace with the real invite once the project manager provides it.
discord_invite_url = ""
