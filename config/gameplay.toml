# Apex Horizon — gameplay configuration.
#
# Design Bible V15.10 requires that gameplay values live in dedicated
# configuration files rather than being scattered through source code, so that
# balance changes never require touching simulation logic (see also V1.22).
#
# Every value below cites the Design Bible section it comes from. Values marked
# "PM decision" were supplied by the project manager where the Design Bible
# deliberately left the figure undefined.

[player]
# V1.2 / V2.3 — the player begins with $10,000 personal capital.
starting_personal_cash = 10_000
# V1.13 — the playthrough ends when personal finances reach this balance.
personal_bankruptcy_threshold = -250_000

[company]
# PM decision (2026-08-08) — founding a company costs $25,000 of personal cash.
# The same figure gates re-founding after a bankruptcy (V3.3 left this open).
founding_cost = 25_000
# PM decision (2026-08-08) — company bankruptcy occurs at this company cash
# balance. V3.20 / V17.25 explicitly left this threshold undefined.
bankruptcy_cash_threshold = -1_000_000
# PM decision (2026-08-08) — minimum personal net worth required to found a
# replacement company after a bankruptcy. V3.3 left this undefined.
refounding_net_worth_requirement = 500_000
# V3.7 — companies progress through Levels 1-5.
max_level = 5
# PM decision (2026-08-08) — maximum employees at each company level. V5.17 and
# V18.5 tie capacity to company level but give no numbers.
employee_capacity_per_level = [10, 25, 50, 100, 200]
# Whether the founding cost becomes the new company's opening cash, or is spent
# as a fee. Treating it as capital is the reading that makes the company usable
# from its first day; a company founded with nothing would force an immediate
# transfer before it could act at all. TODO: confirm with the project manager.
founding_cost_becomes_capital = true
# Reputation (V3.8) runs from 0 to 1 and follows sustained profitability.
starting_reputation = 0.25
reputation_drift = 0.004
# Weekly running cost of simply existing, before salaries (V17.7 operational
# costs). Scales gently with company level as the organisation grows.
weekly_operational_cost = 250
operational_cost_per_level = 400
# Company value (V17.12) is net worth plus a goodwill multiple of recent yearly
# profit, so a profitable company is worth more than the sum of its assets.
value_profit_multiple = 3.0

[tax]
# V13.11 requires yearly government tax calculations and V15.10 lists tax values
# as configuration. The Design Bible sets no rate, so this is a placeholder for
# balancing. TODO: confirm with the project manager.
yearly_profit_rate = 0.22

[loans]
# V17.13: loans have an amount, interest, repayment and history. Repayments fall
# due weekly (V13.9). Interest accrues on the declining balance.
default_term_weeks = 104
minimum_amount = 10_000

[simulation]
# V13.4 — default simulation speed is one real-life second per in-game day.
seconds_per_day = 1.0
# V13.5 / V14.18 — the player may run the simulation at these speeds.
speed_options = [1, 2, 3]
default_speed = 1
# V13.19 — a general background update occurs roughly every five ticks.
background_update_every_ticks = 5
# Upper bound on in-game days simulated in a single update call. V13.27 requires
# long unattended sessions to remain stable and deterministic, so surplus days
# are carried forward and caught up over following frames rather than dropped —
# this cap only keeps any one frame from blocking the interface (V13.29).
max_days_per_update = 30
# Fixed seed used when a world does not supply one. Real saves store their own
# seed so a reloaded world replays identically (V15.11).
default_random_seed = 20260808

[calendar]
# V13.6 — the calendar hierarchy is Year -> Month -> Week -> Day, displayed as
# e.g. "Year 3, Month 8, Week 2, Day 4". V30.4 requires time to be stored as a
# single continuously incrementing day counter, from which this calendar is
# derived (never the reverse).
#
# Seven-day weeks are established by the training example in V5.9/V13.12
# ("beginning on a Friday for 10 days completes the following Monday").
# The Design Bible does not state weeks per month or months per year; uniform
# 4-week months are used so weeks nest cleanly inside months as the V13.6
# display format implies. TODO: confirm with the project manager.
days_per_week = 7
weeks_per_month = 4
months_per_year = 12

[world]
# Initial size of a generated world (V34). These are starting populations, not
# pool limits: the naming databases can produce far more unique names than any
# single playthrough consumes, so the market can keep generating new companies
# across a full lifecycle (V4.14, V33.3).
companies = 60
banks = 8
cities = 24
news_agencies = 5
universities = 6
organisations = 5

[market]
# Share price behaviour (V4.4). Every movement is the sum of traceable
# contributions, never a single opaque random number: company performance,
# industry trend, market sentiment, supply and demand, and bounded variation.
# V4.21 requires movement to always be traceable to an underlying cause.
starting_price_min = 5
starting_price_max = 400
# Shares in issue, used for market capitalisation and to scale the price impact
# of a given order size (V4.8).
shares_outstanding_min = 1_000_000
shares_outstanding_max = 250_000_000

# Daily influence weights. Each is the maximum contribution that source can make
# to a single day's price change, expressed as a fraction of price.
#
# These are deliberately small because they compound every single day: a 0.04%
# daily drift is already about +14% a year, and roughly a fourfold gain across a
# decade, which is the pace a genuinely strong company should manage (V4.11).
# Larger values produce absurd growth over the hundreds of in-game years a save
# may span (V16.20), destroying the believability V4.21 depends on.
performance_weight = 0.0004
industry_weight = 0.0005
sentiment_weight = 0.0004
supply_demand_weight = 0.05
# Per-company random variation, drawn from a normal distribution.
# Volatility is capped well below what a single stock can show in reality,
# because it compounds across the hundreds of in-game years a save may span:
# each company's spread widens with the square root of time, and the most
# volatile company eventually dominates a capitalisation-weighted index.
volatility_min = 0.006
volatility_max = 0.018
# Hard bound on a single day's move, so no combination of causes can produce an
# implausible overnight jump.
max_daily_change = 0.25

# How company fundamentals and the wider mood drift over time. Performance and
# industry trends are re-evaluated weekly (V4.11), sentiment daily (V4.5).
performance_drift = 0.05
industry_trend_drift = 0.08
sentiment_drift = 0.06
sentiment_reversion = 0.10

# Daily closing prices retained per company. Older history is summarised rather
# than kept day by day, so saves stay small (V16.20) while still supporting the
# historical prices of V4.15. TODO: confirm retention with the project manager.
price_history_days = 730

# Long-term market evolution (V4.14). A company trading below the floor for this
# many consecutive days is delisted, and new listings appear over time so the
# market keeps producing fresh opportunities.
delisting_price_floor = 0.5
delisting_grace_days = 28
new_listing_weekly_chance = 0.15
max_listings = 90

[economy]
# The economy is modelled as movement along a single continuous health value in
# the range -1 to +1, with the five named states of V7.4 derived as thresholds
# over it. V7.21 requires exactly this: it keeps the simulation deterministic
# while letting transitions feel gradual rather than binary.
#
# Health and velocity together behave as a damped oscillator: because reversion
# pulls on velocity rather than on health directly, the natural cycle length is
# roughly 2*pi/sqrt(mean_reversion) days. That single relationship is what sets
# the length of a business cycle, so mean_reversion is deliberately tiny — at
# 0.00001 the cycle runs about six in-game years, which is what allows the
# "extended Recession lasting several in-game years" described in V7.19.
# Larger values produce a jittery economy that crosses in and out of recession
# several times a year, which reads as noise rather than a cycle.
daily_drift = 0.00018
momentum = 0.992
mean_reversion = 0.00001
# Reversion pulls toward a mildly positive resting point, so expansions are
# somewhat more common than contractions, as in a real economy.
health_bias = 0.10
# Hysteresis: how far past a threshold the economy must move before the named
# state changes. Prevents flickering between two states on the boundary, so a
# reported state change always means something real (V7.4).
state_hysteresis = 0.05
# The state is named from a trend smoothed over several weeks, not a single
# day's movement, and the trend must be this firm before direction alone renames
# the state. Judging direction from one day's movement would report a Slowdown
# roughly half the time even in a healthy economy.
trend_smoothing = 0.05
trend_threshold = 0.0002

# Annual inflation by economic condition (V7.5). Inflation runs hot in booms and
# cools or turns negative in downturns; V25.2 wants it noticeable across long
# playthroughs rather than short ones.
inflation_base = 0.025
inflation_health_sensitivity = 0.02
inflation_drift = 0.002
inflation_min = -0.02
inflation_max = 0.12

# How strongly economic conditions push share prices (V4.4 lists economic
# conditions as a distinct cause). Kept small: like every market weight this
# compounds daily, and the economy is the *only* channel carrying the aggregate
# effect of the cycle — industries contribute only their difference from the
# market average, and sentiment only leans toward health rather than mirroring
# it, so the same boom is never counted three times over.
market_influence = 0.0002

[banking]
# Banks respond to economic conditions (V7.10): better offers in strong
# economies, more conservative lending in weak ones. Loans themselves belong to
# the Financial Management System (V17.13); this section governs the conditions
# banks offer.
base_interest_rate = 0.06
# How far the interest rate moves between a boom and a deep recession.
rate_health_sensitivity = 0.04
# Multiple of company value a bank will lend at full trust in a strong economy.
base_lending_multiple = 1.5
lending_health_sensitivity = 0.6
# Minimum reputation a company needs before a bank will lend at all; rises when
# the economy weakens (V7.10 "changes in trust requirements").
base_trust_requirement = 0.20
trust_health_sensitivity = 0.25

[random_events]
# V13.18 — approximate probability that a random event fires at each scale.
daily_chance = 0.05
weekly_chance = 0.25
monthly_chance = 0.35
yearly_chance = 0.35

[save]
# V16.8 — five manual save slots, each an independent world.
manual_slots = 5
# V16.5 / V13.10 — autosave every in-game month by default; player-adjustable.
autosave_interval_months = 1
# V16.7 — a single rolling autosave; each new autosave replaces the previous.
rolling_autosave_slots = 1

[support]
# V15.13 — players are asked to report unrecoverable errors here.
# TODO: replace with the real invite once the project manager provides it.
discord_invite_url = ""
