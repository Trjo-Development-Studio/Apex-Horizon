# Apex Horizon — gameplay configuration.
#
# Design Bible V15.10 requires that gameplay values live in dedicated
# configuration files rather than being scattered through source code, so that
# balance changes never require touching simulation logic (see also V1.22).
#
# Every value below cites the Design Bible section it comes from. Values marked
# "PM decision" were supplied by the project manager where the Design Bible
# deliberately left the figure undefined.

[player]
# V1.2 / V2.3 — the player begins with $10,000 personal capital.
starting_personal_cash = 10_000
# V1.13 — the playthrough ends when personal finances reach this balance.
personal_bankruptcy_threshold = -250_000

[company]
# PM decision (2026-08-08) — founding a company costs $25,000 of personal cash.
# The same figure gates re-founding after a bankruptcy (V3.3 left this open).
founding_cost = 25_000
# PM decision (2026-08-08) — company bankruptcy occurs at this company cash
# balance. V3.20 / V17.25 explicitly left this threshold undefined.
bankruptcy_cash_threshold = -1_000_000
# PM decision (2026-08-08) — minimum personal net worth required to found a
# replacement company after a bankruptcy. V3.3 left this undefined.
refounding_net_worth_requirement = 500_000
# V3.7 — companies progress through Levels 1-5.
max_level = 5
# PM decision (2026-08-08) — maximum employees at each company level. V5.17 and
# V18.5 tie capacity to company level but give no numbers.
employee_capacity_per_level = [10, 25, 50, 100, 200]
# Whether the founding cost becomes the new company's opening cash, or is spent
# as a fee. Treating it as capital is the reading that makes the company usable
# from its first day; a company founded with nothing would force an immediate
# transfer before it could act at all. TODO: confirm with the project manager.
founding_cost_becomes_capital = true
# Reputation (V3.8) runs from 0 to 1 and follows sustained profitability.
starting_reputation = 0.25
reputation_drift = 0.004
# Weekly running cost of simply existing, before salaries (V17.7 operational
# costs). Scales gently with company level as the organisation grows.
# Running costs must be small against a company founded with $25,000, and grow
# into a serious overhead only as the organisation does.
weekly_operational_cost = 25
operational_cost_per_level = 120
# Company value (V17.12) is net worth plus a goodwill multiple of recent yearly
# profit, so a profitable company is worth more than the sum of its assets.
value_profit_multiple = 3.0

[tax]
# V13.11 requires yearly government tax calculations and V15.10 lists tax values
# as configuration. The Design Bible sets no rate, so this is a placeholder for
# balancing. TODO: confirm with the project manager.
yearly_profit_rate = 0.22

[loans]
# V17.13: loans have an amount, interest, repayment and history. Repayments fall
# due weekly (V13.9). Interest accrues on the declining balance.
default_term_weeks = 104
minimum_amount = 10_000

[simulation]
# V13.4 — default simulation speed is one real-life second per in-game day.
seconds_per_day = 1.0
# V13.5 / V14.18 — the player may run the simulation at these speeds.
speed_options = [1, 2, 3]
default_speed = 1
# V13.19 — a general background update occurs roughly every five ticks.
background_update_every_ticks = 5
# Upper bound on in-game days simulated in a single update call. V13.27 requires
# long unattended sessions to remain stable and deterministic, so surplus days
# are carried forward and caught up over following frames rather than dropped —
# this cap only keeps any one frame from blocking the interface (V13.29).
max_days_per_update = 30
# Fixed seed used when a world does not supply one. Real saves store their own
# seed so a reloaded world replays identically (V15.11).
default_random_seed = 20260808

[calendar]
# V13.6 — the calendar hierarchy is Year -> Month -> Week -> Day, displayed as
# e.g. "Year 3, Month 8, Week 2, Day 4". V30.4 requires time to be stored as a
# single continuously incrementing day counter, from which this calendar is
# derived (never the reverse).
#
# Seven-day weeks are established by the training example in V5.9/V13.12
# ("beginning on a Friday for 10 days completes the following Monday").
# The Design Bible does not state weeks per month or months per year; uniform
# 4-week months are used so weeks nest cleanly inside months as the V13.6
# display format implies. TODO: confirm with the project manager.
days_per_week = 7
weeks_per_month = 4
months_per_year = 12

[world]
# Initial size of a generated world (V34). These are starting populations, not
# pool limits: the naming databases can produce far more unique names than any
# single playthrough consumes, so the market can keep generating new companies
# across a full lifecycle (V4.14, V33.3).
companies = 60
banks = 8
cities = 24
news_agencies = 5
universities = 6
organisations = 5

[employees]
# Every employee has all three skills of V5.4 - Research, Management and
# Investment - rated on this scale. The maximum an applicant can reach rises
# with the Better Employees unlocks of V6.7.2, which give ranges of 1-20, 1-30
# and 1-40; before any of them the pool is more modest.
skill_minimum = 1
skill_cap_by_tier = [10, 20, 30, 40]

# Effectiveness by department priority (V5.5): an employee performs best in
# their primary department, less well in their secondary, and least in their
# third. This is what lets a single generalist run a small company while
# specialisation still pays off as it grows (V5.6).
primary_effectiveness = 1.0
secondary_effectiveness = 0.6
third_effectiveness = 0.3

# Salary (V5.11). Higher-quality employees cost more, so a strong hire is a
# commitment rather than a free upgrade — but the scale has to suit a company
# founded with $25,000, so a first hire is affordable and a team of specialists
# is a real financial decision.
# A first hire has to be affordable to a company founded with $25,000, since
# V2.18 makes employees the only way to run the investment loop at all. Payroll
# therefore stays small against invested capital, the way it does in a real
# investment firm, and only becomes a serious cost once the company employs
# many highly skilled people.
salary_base = 60
salary_per_skill_point = 4

# Happiness (V5.10) runs 0 to 1 and follows pay, workload and company success.
starting_happiness = 0.6
happiness_drift = 0.06
# Effectiveness at zero happiness, so an unhappy employee still works, badly.
unhappy_effectiveness = 0.45

# Development (V5.8): experience accrues from working and from training, and
# raises skill slowly toward the employee's ceiling.
experience_per_day = 0.9
# Experience needed per skill point. Calibrated so an employee gains a little
# over one point a year in their primary department and less in the others: fast
# enough that development is visible across a playthrough (V5.8), slow enough
# that training remains worth paying for.
experience_per_skill_point = 90
training_experience_per_day = 4.5
training_default_days = 10

# Recruitment (V5.3): how many applicants are offered, and how strongly company
# reputation improves their quality.
applicant_pool_size = 5
reputation_quality_weight = 0.5

[investments]
# The workflow of V8.3: research discovers, management approves, an investor
# executes, the position is held, and the investor eventually sells. Each stage
# is independently timed, so a partly-completed workflow is a valid state
# rather than a transient detail (V8.24).

# Chance per day that a unit of research effectiveness turns up an opportunity.
discovery_chance_per_point = 0.55
# Opportunities go stale if nobody acts on them.
opportunity_lifetime_days = 21
# Chance per day that a unit of management effectiveness reviews a pending
# opportunity, and the minimum expected return a manager will approve.
review_chance_per_point = 0.9
minimum_expected_return = 0.02
# Cash the company always keeps back, so an approval can never leave it unable
# to pay salaries — and so a growing company can accumulate enough to buy
# another outright, which V12.22 requires be paid in full from cash.
#
# A flat figure alone does not survive growth: $2,500 held back by a company
# worth tens of millions is nothing, and such a company stays fully invested for
# ever and can never acquire anything. The reserve is therefore the larger of a
# floor and a share of what the company holds.
cash_reserve = 2_500
cash_reserve_share = 0.2

# Position sizing. An investor commits a share of their own limit, shaped by
# their hidden preferred investment size (V8.13).
minimum_investment = 500
max_positions_per_investor = 6

# Selling (V8.10). Targets and stops widen with risk tolerance, so a cautious
# investor takes profits early and an aggressive one rides further.
target_return_cautious = 0.10
target_return_aggressive = 0.35
stop_loss_cautious = 0.06
stop_loss_aggressive = 0.22
# Even without hitting either, a position is eventually closed.
maximum_hold_days = 900

[funds]
# Investment funds (V11): capital the company manages for outside investors.
# The money in a fund belongs to those investors, never to the player or the
# company (V11.5) - the company earns only the fee for looking after it.

# What investors seed a new fund with, and the most funds the company may run.
initial_deposit = 250_000
maximum_funds = 6

# The company's fee for managing a fund, as a share of assets under management
# each year. Charged on what is managed rather than on profit, which is what
# makes funds expand the company's influence rather than just its winnings
# (V11.4).
annual_management_fee = 0.02

# Investor confidence (V11.11) runs 0 to 1 and follows the fund's record. It
# moves slowly, so trust is earned and lost over time rather than in a month.
starting_confidence = 0.5
confidence_speed = 0.08

# New money arrives on its own once the record justifies it (V11.20): above this
# confidence, investors add this share of what the fund already manages each
# month, scaled by how much they trust it.
deposit_confidence_threshold = 0.45
monthly_deposit_rate = 0.02
minimum_deposit = 5_000

# Months of fund value kept for the performance history (V11.10).
history_months = 240

[acquisitions]
# Acquisitions and subsidiaries (V12). Buying a company outright is permanent
# ownership rather than a temporary position (V12.12), paid for in full from
# company cash with no financing at all (V12.22).

# What control costs above the market's own valuation of a company. The Design
# Bible gives no formula, so the market price is the basis and this is the
# premium nobody sells control without.
control_premium = 0.25

# V12.15 places acquisitions among the later stages of growth, so a company must
# have grown before it can buy another. The player reaches levels through the
# Unlock Tree (V6.7.3); AI companies reach them by being worth enough.
minimum_company_level = 2

# What a subsidiary pays its parent each month, as a share of what the business
# is worth, and how strongly its own industry's fortunes move that (V12.5).
# A declining industry pays less and is worth less, which is what makes a poor
# acquisition genuinely poor (V12.11).
monthly_income_yield = 0.006
industry_income_sensitivity = 0.8

# PM decision (2026-08-08): an acquired company is delisted, since owning it
# outright leaves nothing to trade. New listings appear faster to compensate for
# companies leaving the market this way (see market.new_listing_weekly_chance).

[ai]
# AI companies (V26). They are ordinary investment companies whose decisions are
# generated rather than taken by the player (V26.10), so almost everything about
# them is governed by the settings other systems already use. Only what makes
# them a *population* lives here (V26.11).

# How many operate in the world alongside the player.
company_count = 12

# The capital each is founded with. The spread is wide on purpose: a world of
# identically sized competitors would read as one opponent rather than a
# population of independent organisations.
starting_capital_minimum = 40_000
starting_capital_maximum = 400_000

# V26.4 has AI staff skewing toward higher risk than the player's, through the
# same hidden characteristics (V5.7) rather than a separate system. Each company
# draws its own bias in this range, so some still end up conservative (V26.3).
# Zero would match the player exactly; one leans bolder at every opportunity.
risk_bias_minimum = 0.15
risk_bias_maximum = 0.75

# Recruitment tier AI companies hire at, indexing employees.skill_cap_by_tier.
# They are established organisations rather than a first-time founder, so they
# reach a little beyond an unequipped player without matching a developed one.
recruitment_tier = 1

# How often a company reconsiders its staffing, in days. AI companies act
# continuously (V13.15) but do not re-examine hiring every single day.
hiring_review_days = 14

# Months of payroll a company keeps in reserve before hiring again, which is
# what makes some of them overreach and fail (V26.11, V17.18).
salary_runway_months = 4.0

# How often an AI company considers buying another outright (V12.14), in days,
# and the share of its cash it will spend doing so. PM decision (2026-08-08):
# AI acquisitions are gated by company size like the player's, so the early
# market stays open while the player is still building up.
acquisition_review_days = 90
# An acquisition is meant to feel significant (V12.3), so a company will commit
# most of its free cash to one rather than only a token share.
acquisition_cash_share = 0.9

# Company value needed to reach Levels 2 to 5. The player buys these as unlocks
# (V6.7.3); an AI company has no Unlock Tree, so it grows on what it is worth,
# which keeps growth an emergent outcome of investing well (V26.5, V18.17).
level_value_thresholds = [750_000, 3_000_000, 12_000_000, 50_000_000]

[unlocks]
# The Unlock Tree (V6). New mechanics are earned, never immediately available
# (V6.2). The player always begins with Basic Investing (V6.4), which is what
# makes the opening playable: an individual investor trading their own money.
#
# Prices live here rather than in code so they stay tunable (V15.10). Create
# Company is only permission to found a company - founding it costs
# `company.founding_cost` on top, and is a separate decision (V3.3).
#
# PM decision (2026-08-08): unlock prices are derived from the company founding
# cost rather than written individually, so the whole tree rescales together
# whenever the founding cost is retuned. Each unlock declares how deep it sits
# and takes the matching multiple from this list.
#
# Against a $25,000 founding cost these are:
#   0  $5,000     branch roots off Basic Investing, and Create Company
#   1  $10,000    Company Level 2, and the first step of an early branch
#   2  $25,000    the roots of the five Company Level 2 branches
#   3  $62,500    second steps
#   4  $150,000   third steps
#   5  $375,000   the end of a branch
#   6  $1,000,000 Company Analytics, and Investment Funds
cost_multipliers = [0.2, 0.4, 1.0, 2.5, 6.0, 15.0, 40.0]

# Employee Training branch (V6.7.4). How much faster training teaches at each
# level: no unlocks, then Better Training 1, 2 and 3.
training_speed_multipliers = [1.0, 1.4, 1.9, 2.5]

# Recruitment branch (V6.7.5). Applicants offered before and after More
# Applicants, and how strongly reputation shapes their quality before and after
# Better Recruitment (V5.3).
applicant_pool_by_level = [5, 9]
reputation_weight_by_level = [0.5, 0.85]

[analytics]
# Analytics read the simulation back to the player (V9) and never feed into it
# (V9.22). Depth is gated by tier (V9.4), unlocked through the Unlock Tree.

# How many monthly snapshots of net worth and cash to keep (V9.10). A century
# of play is about 1200 rows, which stays small in a save and charts cleanly.
history_limit = 1200

[news]
# News is generated from events that have actually happened in the simulation
# (V10.9), so an article can always be traced back to something real (V10.24).
# The tiers of V10.4 - Basic, Market, Economic, Breaking - are unlocked through
# the News branch of the Unlock Tree (V6.6.2).

# How large a daily price move must be before it is worth reporting, and how
# large before it is breaking (V10.13).
#
# These are sized against what the market actually does rather than against the
# 25% clamp in [market]. Over 45,733 observed daily moves the median was 0.72%,
# the 99.9th percentile 4.97%, and the largest 7.23% - so a threshold set in the
# double digits would never once be reached, and the Breaking News unlock would
# buy the player nothing. 6% sits just past the 99.99th percentile: a handful of
# genuinely extraordinary sessions a year.
company_move_threshold = 0.045
breaking_move_threshold = 0.06
# Industry and market reporting cadences, in days.
market_report_interval = 7
# How strongly a story pushes the price of the company it concerns (V10.10),
# and how quickly that influence fades. News moves prices for a few days, not
# forever.
impact_strength = 0.35
impact_decay = 0.45
# Articles retained for the archive (V10.15); older ones are discarded so a save
# cannot grow without bound (V16.20).
archive_size = 120

[market]
# Share price behaviour (V4.4). Every movement is the sum of traceable
# contributions, never a single opaque random number: company performance,
# industry trend, market sentiment, supply and demand, and bounded variation.
# V4.21 requires movement to always be traceable to an underlying cause.
starting_price_min = 5
starting_price_max = 400
# Shares in issue, used for market capitalisation and to scale the price impact
# of a given order size (V4.8).
#
# These were fifty times larger, which put market capitalisations in the tens of
# billions while a mature investment company is worth single-digit millions - so
# buying a company outright (V12) could not have happened at any point in any
# playthrough, at any scale of success. Acquisitions are meant to be a late
# stage of growth (V12.15), not an unreachable one.
#
# At this scale the cheapest listed companies cost around $10M with the control
# premium, which a long-running company can reach, while the median company
# stays well beyond any single buyer. Retune here if acquisitions should become
# common earlier.
shares_outstanding_min = 50_000
shares_outstanding_max = 5_000_000

# Daily influence weights. Each is the maximum contribution that source can make
# to a single day's price change, expressed as a fraction of price.
#
# These are deliberately small because they compound every single day. The
# performance weight is the one that matters most: it sets how far a genuinely
# strong company pulls ahead of a weak one, and therefore how much good research
# is actually worth (V4.11, V9.5). Too low and skill cannot pay for itself; too
# high and companies grow absurdly across the centuries a save may span.
performance_weight = 0.0006
industry_weight = 0.0005
sentiment_weight = 0.0004
supply_demand_weight = 0.05
# Per-company random variation, drawn from a normal distribution.
# Volatility is capped well below what a single stock can show in reality,
# because it compounds across the hundreds of in-game years a save may span:
# each company's spread widens with the square root of time, and the most
# volatile company eventually dominates a capitalisation-weighted index.
volatility_min = 0.006
volatility_max = 0.018
# Hard bound on a single day's move, so no combination of causes can produce an
# implausible overnight jump.
max_daily_change = 0.25

# How company fundamentals and the wider mood drift over time. Performance and
# industry trends are re-evaluated weekly (V4.11), sentiment daily (V4.5).
performance_drift = 0.05
industry_trend_drift = 0.08
sentiment_drift = 0.06
sentiment_reversion = 0.10

# Daily closing prices retained per company. Older history is summarised rather
# than kept day by day, so saves stay small (V16.20) while still supporting the
# historical prices of V4.15. TODO: confirm retention with the project manager.
price_history_days = 730

# Long-term market evolution (V4.14). A company trading below the floor for this
# many consecutive days is delisted, and new listings appear over time so the
# market keeps producing fresh opportunities.
delisting_price_floor = 0.5
delisting_grace_days = 28
new_listing_weekly_chance = 0.28
# Days a top gainer or loser is measured over. One in-game day passes every
# real second, so a daily figure changes about once a second - correct, but it
# reads as random because nothing stays on screen long enough to be checked.
# A week is long enough to mean something and short enough to keep moving.
top_mover_period_days = 7
max_listings = 90

[economy]
# The economy is modelled as movement along a single continuous health value in
# the range -1 to +1, with the five named states of V7.4 derived as thresholds
# over it. V7.21 requires exactly this: it keeps the simulation deterministic
# while letting transitions feel gradual rather than binary.
#
# Health and velocity together behave as a damped oscillator: because reversion
# pulls on velocity rather than on health directly, the natural cycle length is
# roughly 2*pi/sqrt(mean_reversion) days. That single relationship is what sets
# the length of a business cycle, so mean_reversion is deliberately tiny — at
# 0.00001 the cycle runs about six in-game years, which is what allows the
# "extended Recession lasting several in-game years" described in V7.19.
# Larger values produce a jittery economy that crosses in and out of recession
# several times a year, which reads as noise rather than a cycle.
daily_drift = 0.00018
momentum = 0.992
mean_reversion = 0.00001
# Reversion pulls toward a mildly positive resting point, so expansions are
# somewhat more common than contractions, as in a real economy.
health_bias = 0.10
# Hysteresis: how far past a threshold the economy must move before the named
# state changes. Prevents flickering between two states on the boundary, so a
# reported state change always means something real (V7.4).
state_hysteresis = 0.05
# The state is named from a trend smoothed over several weeks, not a single
# day's movement, and the trend must be this firm before direction alone renames
# the state. Judging direction from one day's movement would report a Slowdown
# roughly half the time even in a healthy economy.
trend_smoothing = 0.05
trend_threshold = 0.0002

# Annual inflation by economic condition (V7.5). Inflation runs hot in booms and
# cools or turns negative in downturns; V25.2 wants it noticeable across long
# playthroughs rather than short ones.
inflation_base = 0.025
inflation_health_sensitivity = 0.02
inflation_drift = 0.002
inflation_min = -0.02
inflation_max = 0.12

# How strongly economic conditions push share prices (V4.4 lists economic
# conditions as a distinct cause). Kept small: like every market weight this
# compounds daily, and the economy is the *only* channel carrying the aggregate
# effect of the cycle — industries contribute only their difference from the
# market average, and sentiment only leans toward health rather than mirroring
# it, so the same boom is never counted three times over.
market_influence = 0.0002

[banking]
# Banks respond to economic conditions (V7.10): better offers in strong
# economies, more conservative lending in weak ones. Loans themselves belong to
# the Financial Management System (V17.13); this section governs the conditions
# banks offer.
base_interest_rate = 0.06
# How far the interest rate moves between a boom and a deep recession.
rate_health_sensitivity = 0.04
# Multiple of company value a bank will lend at full trust in a strong economy.
base_lending_multiple = 1.5
lending_health_sensitivity = 0.6
# Minimum reputation a company needs before a bank will lend at all; rises when
# the economy weakens (V7.10 "changes in trust requirements").
base_trust_requirement = 0.20
trust_health_sensitivity = 0.25

[random_events]
# V13.18 — approximate probability that a random event fires at each scale.
daily_chance = 0.05
weekly_chance = 0.25
monthly_chance = 0.35
yearly_chance = 0.35

[save]
# V16.8 — five manual save slots, each an independent world.
manual_slots = 5
# PM decision (2026-08-09): autosave on real time rather than game time. V16.5
# says every in-game month, but a month passes in twenty-eight seconds at normal
# speed and nine at triple, so the game was saving constantly. What the setting
# is really for is how much of the player's own time an interruption could cost,
# which is a figure in real minutes. Zero turns autosaving off.
autosave_interval_minutes = 10
# V16.7 — a single rolling autosave; each new autosave replaces the previous.
rolling_autosave_slots = 1

[support]
# V15.13 — players are asked to report unrecoverable errors here.
# TODO: replace with the real invite once the project manager provides it.
discord_invite_url = ""

[debug]
# V15.18 — the developer console. Simulating a year honestly takes a few
# seconds, so a time jump is spread over frames rather than run in one blocking
# call; this is how much of each frame it may use, and how far a single command
# may jump before it is refused as a mistake.
fast_forward_budget_ms = 30
max_fast_forward_years = 50
